[project]
name = "retail-agent"
version = "0.1.0"
description = "Conversational data analysis agent for retail executives"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "db-dtypes>=1.7.1",
    "google-cloud-bigquery>=3.42.3",
    "google-cloud-bigquery-storage>=2.27.0", # faster to_dataframe() fetches
    "langchain>=1.3.14",
    "langchain-google-genai>=2.1.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=2.0.0",
    "pandas>=3.0.5",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "sqlglot>=27.0.0",
    "tenacity>=9.0.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pymilvus[milvus-lite,model]>=3.0.1",
    "transformers<5",
    "milvus-model>=0.2.12",
]

[project.scripts]
retail-agent = "retail_agent.cli.app:main"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not db and not vector'"
markers = [
    "live: requires real BigQuery credentials or a real LLM API key",
    "db: requires a running Postgres (docker compose up -d postgres)",
    "vector: downloads a local embedding model on first run",
]
